stages:
  - Lint
  - Build
  - Release

.build_template:
  stage: Build
  tags:
    - msul-shared
  variables:
    VUFIND_VERSION: "11.0.1"
  before_script:
    - >
      docker login -u $CI_REGISTRY_USER
      -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - >
      docker build
      --build-arg VUFIND_VERSION="${VUFIND_VERSION}"
      --tag "${CI_REGISTRY_IMAGE}":"${VUFIND_VERSION}"
      --cache-from "${CI_REGISTRY_IMAGE}":"${VUFIND_VERSION}"
      .
    - |
      if [[ ${CI_DEFAULT_BRANCH} == "${CI_COMMIT_BRANCH}" ]]; then
        docker push "${CI_REGISTRY_IMAGE}":"${VUFIND_VERSION}";
      fi;

Build v11.0.1:
  extends: .build_template

Build v11.0.2:
  extends: .build_template
  variables:
    VUFIND_VERSION: "11.0.2"

hadolint:
  stage: Lint
  allow_failure: true
  tags:
    - msul-shared
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      changes:
        - 'Dockerfile'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  image: registry.gitlab.com/pipeline-components/hadolint:latest
  script:
    - hadolint Dockerfile

Tag Release:
  stage: Release
  tags:
    - msul-shared
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
  before_script:
    - apk add git
  script:
    - rm -rf clone/ || true
    - git clone https://gitlab-ci-token:$RW_CICD_TOKEN@gitlab.msu.edu/msu-libraries/catalog/vufind-extended.git clone/
    - cd clone/ # doing this to avoid runner cache
    - major_ver=$(date +'%y.%-m')
    - latest_patch=$(git tag -l $major_ver* --sort=-v:refname | head -n 1 | cut -d'.' -f 3)
    - "[ -z $latest_patch ] && cur_patch=-1 || cur_patch=$latest_patch"
    - patch_ver=$(($cur_patch+1))
    - TAG=$major_ver.$patch_ver
    - echo "TAG=$TAG" > ../variables.env
    - echo "Tagging new release with $TAG"
    - git tag $TAG
    - git push origin --tags
  artifacts:
    reports:
      dotenv: variables.env

GitHub Release:
  stage: Release
  tags:
    - msul-shared
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Tag Release
      artifacts: true
  before_script:
    - apk add git curl
  script:
    - rm -rf vufind-extended.git
    - git clone --mirror https://RW_CICD_TOKEN:$RW_CICD_TOKEN@gitlab.msu.edu/msu-libraries/catalog/vufind-extended.git
    - cd vufind-extended.git
    - git push --force --mirror https://$GITHUB_USER_TOKEN@github.com/MSU-Libraries/vufind-extended.git
    - echo "{\"tag_name\":\"${TAG}\", \"target_commitish\":\"${CI_COMMIT_SHA}\"}" > data.json
    - "curl -X POST -H 'Accept: application/vnd.github.v3+json' -u $GITHUB_USER_TOKEN https://api.github.com/repos/MSU-Libraries/vufind-extended/releases -d '@data.json'"

.dockerhub_release:
  stage: Release
  tags:
    - msul-shared
  image: docker:latest
  variables:
    VUFIND_VERSION: "11.0.1"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
  needs:
    - job: Tag Release
      artifacts: true
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker login -u msulibraries -p $DOCKERHUB_TOKEN
  script:
    - docker pull "${CI_REGISTRY_IMAGE}":"${VUFIND_VERSION}"
    - docker tag "${CI_REGISTRY_IMAGE}":"${VUFIND_VERSION}" msulibraries/vufind-extended:"${VUFIND_VERSION}"
    - docker push msulibraries/vufind-extended:"${VUFIND_VERSION}"

DockerHub Release v11.0.1:
  extends: .dockerhub_release

DockerHub Release v11.0.2:
  extends: .dockerhub_release
  variables:
    VUFIND_VERSION: "11.0.2"
